---
"on":
  push:
    branches:
      - master
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
jobs:
  flake-check:
    name: nix flake check
    runs-on: native
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # The runner is x86_64; the aarch64 outputs are only evaluated.
      - run: nix flake check --print-build-logs --system x86_64-linux
