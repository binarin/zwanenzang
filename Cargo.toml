[package]
name = "zwanenzang"
version = "0.1.0"
edition = "2024"
description = "A small, local-first issue tracker for one person and their agents"
license = "MIT"
rust-version = "1.89"

[lib]
path = "src/lib.rs"

[[bin]]
name = "zwanenzang"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
